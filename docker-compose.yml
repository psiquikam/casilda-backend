services:
  db:
    image: postgres:12
    container_name: casilda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: casilda
      POSTGRES_USER: casilda
      POSTGRES_PASSWORD: casilda
    ports:
      - "5432:5432"
    volumes:
      - casilda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casilda -d casilda"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casilda-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/casilda
      SPRING_DATASOURCE_USERNAME: casilda
      SPRING_DATASOURCE_PASSWORD: casilda
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  casilda_pgdata:

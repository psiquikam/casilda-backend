spring:
  application:
    name: casilda-backend
  config:
    import: optional:file:./correo-reparto-local.properties
  
  datasource:
    url: jdbc:postgresql://localhost:5432/casilda
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  mail:
    host: ${CASILDA_SMTP_HOST:smtp-relay.brevo.com}
    port: ${CASILDA_SMTP_PORT:587}
    username: ${CASILDA_SMTP_USUARIO:}
    password: ${CASILDA_SMTP_CLAVE:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  correo-reparto:
    habilitado: ${CASILDA_CORREO_REPARTO_HABILITADO:false}
    remitente: ${CASILDA_CORREO_REPARTO_REMITENTE:}
    destinatarios: ${CASILDA_CORREO_REPARTO_DESTINATARIOS:}
  reportes:
    evidencias:
      directorio: uploads/reportes
  contenidos:
    imagenes:
      directorio: uploads/contenidos
      url-base: /contenidos/imagenes

logging:
  level:
    co.edu.udea.casilda: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000  # 24 horas en milisegundos
